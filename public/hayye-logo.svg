<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191D21"/>
      <stop offset="55%" stop-color="#0E1012"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="hrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="hglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="44" y="44" width="936" height="936" rx="210" fill="url(#hbg)"/>
  <rect x="48" y="48" width="928" height="928" rx="206" fill="none" stroke="url(#hrim)" stroke-width="6"/>

  <!-- Subtle precision market grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <line x1="210" y1="220" x2="210" y2="804"/>
    <line x1="512" y1="220" x2="512" y2="804"/>
    <line x1="814" y1="220" x2="814" y2="804"/>
    <line x1="180" y1="360" x2="844" y2="360"/>
    <line x1="180" y1="512" x2="844" y2="512"/>
    <line x1="180" y1="664" x2="844" y2="664"/>
  </g>

  <!-- Architectural H Monolith Pillars -->
  <rect x="236" y="236" width="84" height="552" rx="16" fill="#F2EFE9"/>
  <rect x="704" y="236" width="84" height="552" rx="16" fill="#F2EFE9"/>

  <!-- Dynamic Market Dip-and-Capture Pulse Crossing the H -->
  <path d="M 278 520 L 420 520 L 502 642 L 622 368 L 746 470"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#hglow)"/>

  <!-- Dip Target Beacon -->
  <circle cx="502" cy="642" r="32" fill="#0E1012" stroke="#10B981" stroke-width="14"/>
  <!-- 2nd-Hand Cobalt Accent Node -->
  <circle cx="622" cy="368" r="24" fill="#3B82F6" stroke="#F2EFE9" stroke-width="8"/>
</svg>
