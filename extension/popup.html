<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Hayye Market</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px; margin: 0; padding: 14px;
      background: #090A0C; color: #F5F2EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .brand img { width: 24px; height: 24px; border-radius: 7px; }
    .pill { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); color: #8F96A3; }
    .pill.ok { color: #10B981; border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.1); }
    .card { background: #111317; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 12px; margin-bottom: 10px; }
    .title { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
    .price { font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700; color: #10B981; }
    .lbl { font-size: 11px; color: #8F96A3; margin: 10px 0 6px; display: block; }
    .sizes { display: flex; flex-wrap: wrap; gap: 5px; }
    .sz {
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #F5F2EB;
      border-radius: 999px; padding: 4px 10px; font-size: 11px; font-family: ui-monospace, monospace; cursor: pointer;
    }
    .sz.sel { background: #10B981; color: #090A0C; border-color: #10B981; font-weight: 700; }
    .sz.out { opacity: 0.55; text-decoration: line-through; }
    input {
      width: 100%; background: #090A0C; border: 1px solid rgba(255,255,255,0.1);
      color: #F5F2EB; border-radius: 12px; padding: 8px 10px; font-size: 12px; font-family: ui-monospace, monospace;
    }
    .btn {
      width: 100%; margin-top: 10px; padding: 10px; border-radius: 999px; border: none;
      background: #10B981; color: #090A0C; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    #msg { font-size: 11px; color: #10B981; margin-top: 8px; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="icons/icon32.png" alt="H" /> Hayye Market</div>
    <span id="conn" class="pill">Kontrol...</span>
  </div>
  <div id="content" class="card">
    <div style="font-size:12px;color:#8F96A3">Sayfa okunuyor...</div>
  </div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
